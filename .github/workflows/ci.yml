name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build, Run Pipeline, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc

      # Optional: pull data if you have a DVC remote configured with secrets
      # - name: DVC pull
      #   run: dvc pull
      #   env:
      #     AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Reproduce DVC pipeline
        run: |
          dvc repro
        continue-on-error: true # <--- ADD THIS LINE
        # If dvc repro is not ready for CI yet, temporarily allow failure:
        # continue-on-error: true

      - name: Show metrics (optional)
        run: dvc metrics show || true

      - name: Run tests (if you add them later)
        run: |
          # pytest -q || true
          echo "Add pytest here when ready"

  docker-build:
    name: Build and Push Docker Image
    needs: build # ← must match the job id above
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if Dockerfile exists
        id: check_docker
        run: |
          if [ -f Dockerfile ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No Dockerfile found, skipping Docker build."
          fi

      - name: Set up Docker Buildx
        if: steps.check_docker.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check_docker.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: steps.check_docker.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sms-spam-classifier:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sms-spam-classifier:${{ github.sha }}
